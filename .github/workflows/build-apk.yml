name: Compilar APK Autónoma

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias globales y Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm init -y
          npm install @capacitor/android
          npx cap init ZonaTrialApp com.zonatrial.app --web-dir .

      - name: Empaquetar backend local y proyecto
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Release / Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ZonaTrialApp-Control-TV
          path: android/app/build/outputs/apk/debug/app-debug.apk
