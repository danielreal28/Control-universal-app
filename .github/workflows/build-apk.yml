name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare web assets and Sync Capacitor
        run: |
          # 1. Crear directorio www y copiar assets
          mkdir -p www
          cp -r index.html css js assets www/ 2>/dev/null || cp index.html www/
          
          # 2. Corregir configuracion de webDir a www
          if [ -f "capacitor.config.json" ]; then
            sed -i 's/"webDir": "\."/"webDir": "www"/g' capacitor.config.json
          fi

          # 3. Dar permisos al binario y sincronizar
          chmod +x ./node_modules/.bin/cap || true
          npx @capacitor/cli sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Control-Universal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
